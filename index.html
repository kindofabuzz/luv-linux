<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Luv-Linux.Me</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #080a0e;
                --surface: #0d1117;
                --border: #1e2a38;
                --accent: #00ff88;
                --accent2: #0066ff;
                --text: #c9d1d9;
                --muted: #4a5568;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: "JetBrains Mono", monospace;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                padding: 2rem;
            }

            /* Grid background */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(var(--border) 1px, transparent 1px),
                    linear-gradient(90deg, var(--border) 1px, transparent 1px);
                background-size: 40px 40px;
                opacity: 0.4;
                z-index: 0;
            }

            /* Glow orb */
            body::after {
                content: "";
                position: fixed;
                top: -10%;
                left: 50%;
                transform: translateX(-50%);
                width: 800px;
                height: 600px;
                background: radial-gradient(
                    circle,
                    rgba(0, 255, 136, 0.08) 0%,
                    transparent 70%
                );
                z-index: 0;
                pointer-events: none;
            }

            .container {
                position: relative;
                z-index: 1;
                text-align: center;
                max-width: 1400px;
                width: 100%;
            }

            .eyebrow {
                font-size: 0.7rem;
                letter-spacing: 0.4em;
                color: var(--accent);
                text-transform: uppercase;
                margin-bottom: 1rem;
            }

            h1 {
                font-family: "Bebas Neue", sans-serif;
                font-size: clamp(3rem, 10vw, 5rem);
                letter-spacing: 0.05em;
                line-height: 1.1;
                background: linear-gradient(160deg, #ffffff 0%, #6b7a8d 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                position: relative;
                margin-bottom: 1rem;
            }

            h1 .accent-word {
                background: linear-gradient(
                    160deg,
                    var(--accent) 0%,
                    var(--accent2) 100%
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .tagline {
                font-size: 0.75rem;
                color: var(--muted);
                letter-spacing: 0.15em;
                margin-top: 0.5rem;
                margin-bottom: 3rem;
            }

            .hero-art {
                display: block;
                margin: 0 auto 2.5rem;
                filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.15));
            }

            /* Horizontal card grid */
            .links-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1.5rem;
                max-width: 1100px;
                margin: 0 auto;
                padding: 2rem 0;
            }

            .link-card {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                padding: 2rem 2.5rem;
                background: var(--surface);
                border: 1px solid var(--border);
                text-decoration: none;
                color: var(--text);
                overflow: hidden;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                min-height: 140px;
            }

            .link-card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    135deg,
                    rgba(0, 255, 136, 0.06),
                    rgba(0, 102, 255, 0.04)
                );
                opacity: 0;
                transition: opacity 0.3s;
            }

            .link-card::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 3px;
                background: linear-gradient(
                    90deg,
                    var(--accent) 0%,
                    var(--accent2) 100%
                );
                transform: scaleX(0);
                transform-origin: left;
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .link-card:hover {
                border-color: var(--accent);
                transform: translateY(-4px);
                box-shadow:
                    0 10px 40px rgba(0, 255, 136, 0.15),
                    0 0 0 1px rgba(0, 255, 136, 0.1);
            }

            .link-card:hover::before {
                opacity: 1;
            }

            .link-card:hover::after {
                transform: scaleX(1);
            }

            .link-card:hover .link-icon {
                color: var(--accent);
                transform: translate(3px, -3px);
            }

            /* Usage badge */
            .usage-badge {
                font-size: 0.55rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                margin-bottom: 0.8rem;
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .usage-badge.public {
                color: var(--accent);
            }

            .usage-badge.private {
                color: var(--accent2);
            }

            .usage-dot {
                display: inline-block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: var(--accent);
            }

            .link-label {
                font-size: 0.65rem;
                letter-spacing: 0.3em;
                color: var(--muted);
                text-transform: uppercase;
                margin-bottom: 0.6rem;
                position: relative;
                z-index: 1;
            }

            .link-name {
                font-size: 1.4rem;
                font-weight: 400;
                color: #fff;
                position: relative;
                z-index: 1;
            }

            .link-icon {
                position: absolute;
                top: 1.5rem;
                right: 1.5rem;
                font-size: 1.2rem;
                color: var(--muted);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1;
            }

            /* Decorative corner accents */
            .link-card .corner-accent {
                position: absolute;
                width: 20px;
                height: 20px;
                opacity: 0.3;
                transition: opacity 0.3s;
            }

            .link-card:hover .corner-accent {
                opacity: 0.6;
            }

            .corner-accent.tl {
                top: 0;
                left: 0;
                border-top: 2px solid var(--accent);
                border-left: 2px solid var(--accent);
            }

            .corner-accent.br {
                bottom: 0;
                right: 0;
                border-bottom: 2px solid var(--accent2);
                border-right: 2px solid var(--accent2);
            }

            .corner-tag {
                position: fixed;
                bottom: 1.5rem;
                right: 1.5rem;
                font-size: 0.6rem;
                color: var(--muted);
                letter-spacing: 0.2em;
                z-index: 1;
            }

            .status-dot {
                display: inline-block;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
                margin-right: 0.5rem;
                vertical-align: middle;
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            @media (max-width: 768px) {
                body {
                    padding: 1rem;
                }

                .hero-art {
                    width: 280px;
                    height: auto;
                    margin-bottom: 1.5rem;
                }

                h1 {
                    font-size: clamp(2rem, 8vw, 3rem);
                    margin-bottom: 0.5rem;
                }

                .tagline {
                    margin-bottom: 2rem;
                }

                .links-grid {
                    grid-template-columns: 1fr;
                    gap: 1rem;
                    padding: 1rem 0;
                }

                .link-card {
                    padding: 1.5rem 2rem;
                    min-height: 120px;
                }

                .corner-tag {
                    font-size: 0.55rem;
                    bottom: 1rem;
                    right: 1rem;
                }

                body::before {
                    background-size: 30px 30px;
                }

                body::after {
                    width: 400px;
                    height: 400px;
                }
            }

            @media (min-width: 769px) and (max-width: 1024px) {
                .links-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <svg
                class="hero-art"
                width="320"
                height="220"
                viewBox="0 0 320 220"
                xmlns="http://www.w3.org/2000/svg"
            >
                <defs>
                    <radialGradient id="bgGlow" cx="50%" cy="60%" r="60%">
                        <stop offset="0%" stop-color="#001a0d" />
                        <stop offset="100%" stop-color="#080a0e" />
                    </radialGradient>
                </defs>

                <!-- Background -->
                <rect width="320" height="220" fill="url(#bgGlow)" rx="2" />

                <!-- Subtle grid -->
                <g opacity="0.12" stroke="#1e2a38" stroke-width="0.5">
                    <line x1="0" y1="40" x2="320" y2="40" />
                    <line x1="0" y1="80" x2="320" y2="80" />
                    <line x1="0" y1="120" x2="320" y2="120" />
                    <line x1="0" y1="160" x2="320" y2="160" />
                    <line x1="0" y1="200" x2="320" y2="200" />
                    <line x1="40" y1="0" x2="40" y2="220" />
                    <line x1="80" y1="0" x2="80" y2="220" />
                    <line x1="120" y1="0" x2="120" y2="220" />
                    <line x1="160" y1="0" x2="160" y2="220" />
                    <line x1="200" y1="0" x2="200" y2="220" />
                    <line x1="240" y1="0" x2="240" y2="220" />
                    <line x1="280" y1="0" x2="280" y2="220" />
                </g>

                <!-- Tux left wing going behind Gopher (drawn first so Gopher body covers the tip) -->
                <path d="M185,142 Q147,120 116,153" stroke="#151515" stroke-width="22" fill="none" stroke-linecap="round" />
                <path d="M185,142 Q147,120 116,153" stroke="#252525" stroke-width="14" fill="none" stroke-linecap="round" />

                <!-- TUX -->
                <!-- Feet -->
                <ellipse cx="203" cy="208" rx="19" ry="7" fill="#F5A623" transform="rotate(-13,203,208)" />
                <ellipse cx="229" cy="208" rx="19" ry="7" fill="#F5A623" transform="rotate(13,229,208)" />
                <!-- Body -->
                <ellipse cx="216" cy="157" rx="37" ry="48" fill="#1a1a1a" />
                <!-- Belly -->
                <ellipse cx="216" cy="163" rx="23" ry="33" fill="#F0DEB0" />
                <!-- Right wing -->
                <path d="M250,132 Q272,158 256,190" stroke="#151515" stroke-width="22" fill="none" stroke-linecap="round" />
                <path d="M250,132 Q272,158 256,190" stroke="#252525" stroke-width="14" fill="none" stroke-linecap="round" />
                <!-- Head -->
                <circle cx="216" cy="80" r="32" fill="#1a1a1a" />
                <!-- Face patch -->
                <ellipse cx="216" cy="87" rx="19" ry="21" fill="#F0DEB0" />
                <!-- Eyes -->
                <circle cx="206" cy="74" r="9" fill="white" />
                <circle cx="226" cy="74" r="9" fill="white" />
                <circle cx="207" cy="75" r="5" fill="#111" />
                <circle cx="227" cy="75" r="5" fill="#111" />
                <circle cx="205" cy="72" r="2" fill="white" />
                <circle cx="225" cy="72" r="2" fill="white" />
                <!-- Beak -->
                <path d="M210,96 L222,96 L216,108 Z" fill="#F5A623" />
                <line x1="210" y1="102" x2="222" y2="102" stroke="#D49018" stroke-width="0.8" />

                <!-- GOPHER (drawn after Tux so it layers in front) -->
                <!-- Ears -->
                <ellipse cx="76" cy="56" rx="13" ry="17" fill="#7EC8D8" />
                <ellipse cx="76" cy="56" rx="8" ry="11" fill="#F0B8D0" />
                <ellipse cx="124" cy="56" rx="13" ry="17" fill="#7EC8D8" />
                <ellipse cx="124" cy="56" rx="8" ry="11" fill="#F0B8D0" />
                <!-- Body -->
                <ellipse cx="100" cy="155" rx="34" ry="43" fill="#7EC8D8" />
                <!-- Belly -->
                <ellipse cx="100" cy="161" rx="21" ry="29" fill="#B8E8F4" />
                <!-- Left arm (outer, visible) -->
                <path d="M67,132 Q46,160 59,192" stroke="#7EC8D8" stroke-width="20" fill="none" stroke-linecap="round" />
                <path d="M67,132 Q46,160 59,192" stroke="#9ED8EC" stroke-width="12" fill="none" stroke-linecap="round" />
                <!-- Head -->
                <circle cx="100" cy="82" r="32" fill="#7EC8D8" />
                <!-- Eyes (large — the Gopher's signature feature) -->
                <circle cx="86" cy="77" r="14" fill="white" />
                <circle cx="114" cy="77" r="14" fill="white" />
                <circle cx="87" cy="78" r="8" fill="#4AC0D8" />
                <circle cx="115" cy="78" r="8" fill="#4AC0D8" />
                <circle cx="88" cy="79" r="5" fill="#111" />
                <circle cx="116" cy="79" r="5" fill="#111" />
                <circle cx="85" cy="75" r="2.5" fill="white" />
                <circle cx="113" cy="75" r="2.5" fill="white" />
                <!-- Nose -->
                <ellipse cx="100" cy="95" rx="12" ry="8" fill="#C4956A" />
                <circle cx="95" cy="96" r="3" fill="#8B5E3C" />
                <circle cx="105" cy="96" r="3" fill="#8B5E3C" />
                <!-- Buckteeth -->
                <rect x="93" y="103" width="8" height="10" fill="white" rx="1.5" />
                <rect x="102" y="103" width="8" height="10" fill="white" rx="1.5" />
                <line x1="101" y1="103" x2="101" y2="113" stroke="#d0d0d0" stroke-width="0.5" />

                <!-- Gopher right arm over Tux (drawn last — appears on top of Tux) -->
                <path d="M129,138 Q167,115 200,149" stroke="#7EC8D8" stroke-width="20" fill="none" stroke-linecap="round" />
                <path d="M129,138 Q167,115 200,149" stroke="#9ED8EC" stroke-width="12" fill="none" stroke-linecap="round" />

                <!-- Heart -->
                <text x="160" y="30" text-anchor="middle" font-size="14" fill="#00ff88" opacity="0.75">♥</text>

                <!-- Border -->
                <rect x="0.75" y="0.75" width="318.5" height="218.5" fill="none" stroke="#1e2a38" stroke-width="1.5" rx="2" />
                <!-- Corner accents -->
                <polyline points="0,20 0,0 20,0" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6" />
                <polyline points="300,0 320,0 320,20" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6" />
                <polyline points="0,200 0,220 20,220" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6" />
                <polyline points="300,220 320,220 320,200" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.6" />
            </svg>
            <h1>
                Welcome to<br /><span class="accent-word">Luv-Linux.Me!</span>
                Fuck Trump!!
            </h1>
            <p class="tagline">// now git!</p>

            <div class="links-grid">
                <a href="https://git.luv-linux.me" class="link-card">
                    <span class="corner-accent tl"></span>
                    <span class="corner-accent br"></span>
                    <div class="usage-badge public">
                        <span>public use</span>
                        <span class="usage-dot"></span>
                    </div>
                    <span class="link-label">forge</span>
                    <span class="link-name">Forgejo</span>
                    <span class="link-icon">↗</span>
                </a>

                <a href="https://cloud.luv-linux.me" class="link-card">
                    <span class="corner-accent tl"></span>
                    <span class="corner-accent br"></span>
                    <div class="usage-badge private">
                        <span>personal use</span>
                    </div>
                    <span class="link-label">cloud storage</span>
                    <span class="link-name">Cloudreve</span>
                    <span class="link-icon">↗</span>
                </a>

                <a href="https://vault.luv-linux.me" class="link-card">
                    <span class="corner-accent tl"></span>
                    <span class="corner-accent br"></span>
                    <div class="usage-badge private">
                        <span>personal use</span>
                    </div>
                    <span class="link-label">secrets</span>
                    <span class="link-name">Vaultwarden</span>
                    <span class="link-icon">↗</span>
                </a>

                <a href="https://go.dev" class="link-card">
                    <span class="corner-accent tl"></span>
                    <span class="corner-accent br"></span>
                    <div class="usage-badge public">
                        <span>TBD</span>
                        <span class="usage-dot"></span>
                    </div>
                    <span class="link-label">prototype</span>
                    <span class="link-name">Potential Project</span>
                    <span class="link-icon">✨</span>
                </a>
            </div>
        </div>

        <div class="corner-tag">
            <span class="status-dot"></span>all systems operational
        </div>
    </body>
</html>
